<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Panel - Watch Store</title>

  <!-- ✅ Bootstrap CSS & JS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

  <!-- 🧭 Navbar -->
  <nav class="navbar navbar-expand-lg bg-body shadow-sm px-4 py-3">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#">⌚ Watch Store Admin</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <a class="btn btn-outline-primary" href="index.html">← Back to Site</a>
      </div>
    </div>
  </nav>

  <div class="container py-5">

    <!-- 🔐 Login Form -->
    <div id="loginSection" class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h3 class="text-center mb-4">Admin Login</h3>
            <div class="mb-3">
              <label class="form-label">Username</label>
              <input id="username" type="text" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input id="password" type="password" class="form-control">
            </div>
            <button onclick="login()" class="btn btn-primary w-100">Login</button>
            <div id="loginError" class="alert alert-danger mt-3 d-none">Invalid credentials.</div>
          </div>
        </div>
      </div>
    </div>

    <!-- ➕ Add Watch Form (Hidden by default) -->
    <div id="adminPanel" class="row justify-content-center d-none">
      <div class="col-md-8">
        <div class="card shadow-sm mt-4">
          <div class="card-body">
            <h3 class="text-center mb-4">Add New Watch</h3>

            <div class="mb-3">
              <label class="form-label">Brand</label>
              <input type="text" id="brand" class="form-control" />
            </div>
            <div class="mb-3">
              <label class="form-label">Model</label>
              <input type="text" id="model" class="form-control" />
            </div>
            <div class="mb-3">
              <label class="form-label">Condition</label>
              <input type="text" id="condition" class="form-control" />
            </div>
            <div class="mb-3">
              <label class="form-label">Price ($)</label>
              <input type="number" id="price" class="form-control" />
            </div>
            <div class="mb-3">
              <label class="form-label">Image URL</label>
              <input type="text" id="imageUrl" class="form-control" />
            </div>
            <button onclick="addWatch()" class="btn btn-success w-100">Add Watch</button>

            <div id="successMessage" class="alert alert-success mt-3 d-none">✅ Watch added successfully (not saved permanently).</div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- 👨‍💻 JavaScript Logic -->
  <script>
    const ADMIN_USER = "admin";
    const ADMIN_PASS = "password123";
    const adminWatches = [];

    function login() {
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;

      if (user === ADMIN_USER && pass === ADMIN_PASS) {
        document.getElementById("loginSection").classList.add("d-none");
        document.getElementById("adminPanel").classList.remove("d-none");
      } else {
        document.getElementById("loginError").classList.remove("d-none");
      }
    }

    function addWatch() {
      const watch = {
        brand: document.getElementById("brand").value,
        model: document.getElementById("model").value,
        condition: document.getElementById("condition").value,
        price: parseFloat(document.getElementById("price").value),
        image: document.getElementById("imageUrl").value || "https://via.placeholder.com/400x250"
      };

      adminWatches.push(watch);
      console.log("✅ Watch added:", watch);

      document.getElementById("successMessage").classList.remove("d-none");
      document.querySelectorAll("#adminPanel input").forEach(input => input.value = "");
    }
  </script>
  <!-- Include Footer -->
    <div id="footer"></div>
    <script>
    fetch("footer.html")
        .then(res => res.text())
        .then(data => document.getElementById("footer").innerHTML = data);
    </script>


</body>
</html>
